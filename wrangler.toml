# warz.io on Cloudflare Workers (free plan). Deploy with `npx wrangler deploy`; run locally with `npm run dev:cf`.
name = "warz-io"
main = "server/cf/worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

# The game's files (index.html, js/, css/) are served as static assets. .assetsignore keeps server code out.
[assets]
directory = "./"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubObject"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubObject", "MatchObject"]

[vars]
LOBBY_MIN = "1"          # real players needed before the countdown starts (bots do not count)
LOBBY_COUNTDOWN = "20"   # seconds a lobby waits for more real players before the match starts
LOBBY_MAX = "50"
BOT_FILL = "50"          # every match is filled up to this many players with bots; "0" turns bots off
BOT_SKILL = "0.5"        # how good the bots are, from "0" (easy) to "1" (hard); "0.5" is the normal mix of weak, average and good ones
# Sign-in providers (see README). Put the public client IDs here, or set them with `npx wrangler secret put`.
# GOOGLE_CLIENT_ID = "1234567890-abc.apps.googleusercontent.com"
# APPLE_CLIENT_ID = "com.yourname.warz.web"
# PUBLIC_URL = "https://warz-io.<your-account>.workers.dev"
